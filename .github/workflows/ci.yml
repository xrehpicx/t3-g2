name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Pack the public build
        run: npm run pack
      - name: The public build must not contain personal addresses
        run: |
          if grep -rIlE '([0-9]{1,3}\.){3}[0-9]{1,3}:[0-9]+|tail[0-9a-f]+\.ts\.net' dist app.json; then
            echo "::error::A hostname or IP address is in the public build"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: t3-g2-ehpk
          path: t3-g2.ehpk
          if-no-files-found: error

  # Merged to main -> a new private build on Even Hub (once per version in app.json).
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: even-hub
    concurrency:
      group: even-hub-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run pack
      - name: Upload to Even Hub
        env:
          EVENHUB_CREDENTIALS: ${{ secrets.EVENHUB_CREDENTIALS }}
          CHANGELOG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$EVENHUB_CREDENTIALS" ]; then
            echo "::warning::EVENHUB_CREDENTIALS is not set, so nothing was uploaded. See 'Deploying' in the README."
            exit 0
          fi
          export XDG_CONFIG_HOME="$RUNNER_TEMP/evenhub-config"
          umask 077
          mkdir -p "$XDG_CONFIG_HOME/evenhub"
          printf '%s\n' "$EVENHUB_CREDENTIALS" > "$XDG_CONFIG_HOME/evenhub/credentials.yaml"
          trap 'rm -rf "$XDG_CONFIG_HOME"' EXIT
          node scripts/deploy.mjs
